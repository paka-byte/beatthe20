# อัปเดต data/keepers.json อัตโนมัติทุกสัปดาห์ แล้ว commit กลับเข้า repo → Netlify deploy ใหม่ให้เอง
name: Update keeper data

on:
  schedule:
    # อังคาร 02:17 UTC (= 09:17 เวลาไทย) หลัง GW ส่วนใหญ่จบ
    - cron: "17 2 * * 2"
    # ศุกร์ 02:17 UTC เผื่อสัปดาห์ที่มีเกมกลางสัปดาห์
    - cron: "17 2 * * 5"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore match cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fotmob-cache-${{ github.run_id }}
          restore-keys: fotmob-cache-

      - name: Fetch data
        run: node scripts/fetch-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/keepers.json; then
            echo "ไม่มีข้อมูลใหม่"
          else
            git config user.name "beat-the-20-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/keepers.json
            git commit -m "data: update keepers ($(date -u +%F))"
            git push
          fi
